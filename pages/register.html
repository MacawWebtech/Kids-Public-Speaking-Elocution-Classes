<div class="auth-wrap">
  <div class="auth-art">
    <svg class="spot-beam" viewBox="0 0 400 520" aria-hidden="true" focusable="false"><defs><linearGradient id="pb25" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A1A" stop-opacity=".45"/><stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/></linearGradient></defs><path d="M180 0h40l170 520H10z" fill="url(#pb25)"/></svg>
    <a class="brand" href="../index.html" style="color:#fff"><span class="brand-mark" aria-hidden="true" style="background:var(--su-orange);color:var(--su-navy)"><i class="bi bi-mic-fill"></i></span><span>SpeakUp Stage<small style="color:var(--su-orange)">every child gets a stage</small></span></a>
    <div class="art-img"><img src="../assets/images/speaker3.jpg" alt="A group of children sitting together on the ground" width="840" height="640" fetchpriority="high" loading="eager" decoding="async"></div>

  </div>
  <main class="auth-main" id="main" tabindex="-1">
    <div class="auth-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a class="brand d-lg-none" href="../index.html"><span class="brand-mark" aria-hidden="true"><i class="bi bi-mic-fill"></i></span><span>SpeakUp Stage</span></a>
        <a class="link-arrow d-none d-lg-inline-flex" href="../index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to website</a>
        <div class="header-tools"><button class="tool-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"><i class="bi bi-moon-stars-fill" aria-hidden="true"></i></button><button class="tool-btn" type="button" data-rtl-toggle aria-pressed="false" aria-label="Switch to right-to-left layout"><span class="rtl-label">RTL</span></button></div>
      </div>
      <h1>Create your parent account</h1>
      <p class="text-muted-su mb-4">One account for all your children. It takes about a minute.</p>
      <form class="su-form" data-redirect="../dashboard/index.html" aria-label="Create parent account">
  <div class="row g-3">
    <div class="col-sm-6 field"><label class="form-label" for="rg-first">Your first name</label><input class="form-control" id="rg-first" name="first" required autocomplete="given-name" data-msg="Please tell us your first name."></div>
    <div class="col-sm-6 field"><label class="form-label" for="rg-last">Last name</label><input class="form-control" id="rg-last" name="last" required autocomplete="family-name" data-msg="Please tell us your last name."></div>
    <div class="col-12 field"><label class="form-label" for="rg-email">Email</label><input class="form-control" id="rg-email" type="email" name="email" required autocomplete="email"></div>
    <div class="col-sm-6 field"><label class="form-label" for="rg-child">Child's first name</label><input class="form-control" id="rg-child" name="child" required data-msg="Please tell us your child's name. You can add more children later."></div>
    <div class="col-sm-6 field"><label class="form-label" for="rg-age">Child's age</label><input class="form-control" id="rg-age" type="number" name="age" min="5" max="16" required data-msg="Please tell us your child's age (5 to 16)."></div>
    <div class="col-12 field"><label class="form-label" for="rg-pw">Create a password</label><div class="position-relative"><input class="form-control pe-5" id="rg-pw" type="password" name="password" required minlength="8" autocomplete="new-password" data-pw-strength="rg-strength" aria-describedby="rg-strength-text" data-msg="Please use at least 8 characters."><button class="pw-toggle" type="button" data-pw-toggle="rg-pw" aria-label="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div><div class="pw-strength" id="rg-strength" aria-hidden="true"><span></span></div><div class="small text-muted-su mt-1" id="rg-strength-text" aria-live="polite"></div></div>
    <div class="col-12 field"><label class="form-label" for="rg-pw2">Confirm password</label><input class="form-control" id="rg-pw2" type="password" name="password2" required autocomplete="new-password" data-match="rg-pw" data-msg="Please re-type your password."></div>
    <div class="col-12 field"><div class="form-check"><input class="form-check-input" type="checkbox" id="rg-terms" name="terms" required data-msg="Please accept the terms to create your account."><label class="form-check-label" for="rg-terms">I agree to the <a href="contact.html">terms</a> and <a href="contact.html">privacy policy</a>.</label></div></div>
    <div class="col-12"><button class="btn btn-su-primary btn-lg w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create account</button></div>
  </div>
</form>
<p class="text-center mt-4 mb-0">Already have an account? <a class="fw-800" href="login.html">Log in</a></p>
    </div>
  </main>
